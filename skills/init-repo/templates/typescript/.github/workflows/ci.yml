name: ci

on:
  pull_request:
    # Drafts are skipped; ready_for_review runs CI when the PR leaves draft.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: k-b3r/agent-config/.github/workflows/ci-typescript.yml@main
    with:
      jobs: static unit mutation
