name: whitespace
on:
  pull_request:
permissions:
  contents: write
  pull-requests: write
  packages: write
jobs:
  whitespace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git diff --check "origin/${{ github.base_ref }}...HEAD"
