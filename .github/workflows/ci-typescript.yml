# Reusable CI for TypeScript + pnpm repos: the `tool` checks of CODING_STANDARDS.md.
# The repo provides the pnpm scripts it runs (format:check, lint, depcruise,
# typecheck, knip, test, test:integration, test:e2e) and has
# @k-b3r/agent-config as a dev dependency (repo-checks).
#
# Caller (path filters stay in the caller: reusable workflows can't declare them):
#   # .github/workflows/ci.yml
#   on: pull_request
#   concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }
#   jobs:
#     ci:
#       uses: k-b3r/agent-config/.github/workflows/ci-typescript.yml@main
#       with: { jobs: static unit }
#   # .github/workflows/integration.yml: same, with `on: pull_request: paths: [...]`
#   # and `jobs: integration` (likewise e2e.yml with `jobs: e2e`). Tests that need Redis
#   # (queues): `with: { jobs: integration, redis-image: 'redis:7' }`; the job then starts
#   # it and exports TEST_REDIS_URL=redis://localhost:6379 (unset when redis-image is empty).
#
# `repo-checks diff-size` fails a PR over agentConfig.maxDiffLines. Label
# `large-diff-approved` waives it; the label is read from the event payload, so
# add it, then push or close and reopen the PR (a job re-run keeps the old payload).
# `repo-checks contracts-unmodified` fails a PR that edits or deletes a
# *.contract.test.* file; label `contract-change-approved` waives it, same rules.
# The `mutation` job reports mutants that survive in the changed files under
# agentConfig.mutationPaths. Report only: it never fails the PR. It skips itself
# when the repo has no `test:mutation` script or no changed file under the paths.

name: ci-typescript

on:
  workflow_call:
    inputs:
      jobs:
        description: 'Space-separated subset of: static unit integration e2e mutation'
        type: string
        default: static unit mutation
      node-version:
        type: string
        default: '22'
      install-dirs:
        description: 'Space-separated folders with their own pnpm-lock.yaml (e.g. ". dashboard")'
        type: string
        default: .
      static-extra:
        description: 'Extra static commands, one per line (e.g. pnpm docs:check)'
        type: string
        default: ''
      postgres-image:
        description: 'Service for integration/e2e; empty string starts none'
        type: string
        default: postgres:17
      redis-image:
        description: 'Extra Redis service for the integration job (e.g. redis:7). Empty (default) starts none and leaves TEST_REDIS_URL unset'
        type: string
        default: ''
      e2e-setup:
        type: string
        default: pnpm exec playwright install --with-deps chromium

permissions:
  contents: read

env:
  # Disposable service DB; tests read only this var, never the app's.
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
  GITLEAKS_VERSION: 8.30.1

jobs:
  static:
    if: contains(format(' {0} ', inputs.jobs), ' static ')
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'
      - id: install
        env:
          DIRS: ${{ inputs.install-dirs }}
        run: for dir in $DIRS; do (cd "$dir" && pnpm install --frozen-lockfile); done
      # Every check runs even after one fails, so a single push reports them all.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm depcruise
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm knip
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec repo-checks all "origin/$BASE"
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
          ALLOW_LARGE_DIFF: ${{ contains(github.event.pull_request.labels.*.name, 'large-diff-approved') }}
          ALLOW_CONTRACT_CHANGES: ${{ contains(github.event.pull_request.labels.*.name, 'contract-change-approved') }}
      - name: secret scan
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="origin/$BASE..HEAD" .
      - if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.static-extra != '' }}
        env:
          EXTRA: ${{ inputs.static-extra }}
        run: |
          status=0
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            echo "::group::$cmd"
            bash -c "$cmd" || status=1
            echo "::endgroup::"
          done <<< "$EXTRA"
          exit $status

  unit:
    if: contains(format(' {0} ', inputs.jobs), ' unit ')
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'
      - env:
          DIRS: ${{ inputs.install-dirs }}
        run: for dir in $DIRS; do (cd "$dir" && pnpm install --frozen-lockfile); done
      - run: pnpm test

  mutation:
    if: contains(format(' {0} ', inputs.jobs), ' mutation ') && github.event_name == 'pull_request'
    name: mutation report
    runs-on: ubuntu-latest
    # Report only until a floor is calibrated: surviving mutants point at tests that
    # run code without asserting on it, but equivalent mutants add noise.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'
      - env:
          DIRS: ${{ inputs.install-dirs }}
        run: for dir in $DIRS; do (cd "$dir" && pnpm install --frozen-lockfile); done
      - name: Mutate the changed files under agentConfig.mutationPaths
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          if ! jq -e '.scripts["test:mutation"]' package.json > /dev/null; then
            echo "no test:mutation script: skipped" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          targets=$(pnpm exec repo-checks mutation-targets "origin/$BASE" | paste -sd, -)
          if [ -z "$targets" ]; then
            echo "no changed file under agentConfig.mutationPaths: skipped" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "mutating: $targets" | tee -a "$GITHUB_STEP_SUMMARY"
          pnpm test:mutation --mutate "$targets"

  integration:
    if: contains(format(' {0} ', inputs.jobs), ' integration ')
    name: integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      # Empty image: the service is not started (same as postgres-image).
      redis:
        image: ${{ inputs.redis-image }}
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'
      - env:
          DIRS: ${{ inputs.install-dirs }}
        run: for dir in $DIRS; do (cd "$dir" && pnpm install --frozen-lockfile); done
      # Exported only when the service runs, so a test can skip itself on an unset variable.
      - if: inputs.redis-image != ''
        run: echo "TEST_REDIS_URL=redis://localhost:6379" >> "$GITHUB_ENV"
      - run: pnpm test:integration

  e2e:
    if: contains(format(' {0} ', inputs.jobs), ' e2e ')
    name: e2e tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'
      - env:
          DIRS: ${{ inputs.install-dirs }}
        run: for dir in $DIRS; do (cd "$dir" && pnpm install --frozen-lockfile); done
      - env:
          SETUP: ${{ inputs.e2e-setup }}
        run: bash -c "$SETUP"
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
