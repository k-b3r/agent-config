# Reusable PR review: an agent reviews against the coding standards, then a
# gate decides whether the PR can merge or needs a human.
#
# Labels drive the gate:
#   agent-changes-requested  agent found blocking issues (it removes it once fixed)
#   needs-human              agent wants a human decision (business logic, money, data loss, ...)
#   human-approved           a human reviewed a needs-human PR and signs off; dropped on
#                            any push that changes the PR's diff, so an approval only covers
#                            the code the human saw (a clean merge of the base keeps it and
#                            skips the re-review)
#
# Approve by label, or by commenting `/approve` on the PR (repo owner only): that adds
# `human-approved`, removes `needs-human` (the decision is made; a later push that drops
# the approval doesn't re-block the PR unless the re-review raises a new decision) and
# re-runs the failed gate. Labels set with the workflow token don't trigger workflows,
# hence the explicit re-run.
#
# Caller:
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
#     issue_comment:
#       types: [created]
#   jobs:
#     review:
#       uses: k-b3r/agent-config/.github/workflows/pr-review.yml@main
#       permissions: { contents: read, pull-requests: write, issues: write, id-token: write, actions: write }
#       secrets: inherit

name: pr-review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  agent-review:
    # Label changes only re-run the gate; reviewing again would just repeat itself.
    if: github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.action != 'unlabeled' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    concurrency:
      group: agent-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # agent-config is public, so the caller's default token can read it.
      - name: Fetch global standards
        uses: actions/checkout@v7
        with:
          repository: k-b3r/agent-config
          path: .agent-config

      # A push that leaves the PR's own diff unchanged (pr-upkeep merging the
      # base in) changes nothing a reviewer saw: keep `human-approved` and skip
      # the re-review (the action also refuses bot-triggered runs). Confirmed
      # live 2026-10-06 on k-b3r/buy-and-sell-ai#30..#33: each upkeep merge
      # dropped the approval and failed the review.
      - name: Check whether the push changed the PR diff
        id: diff
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if node .agent-config/scripts/pr-automation.mjs diff-unchanged "$REPO" "$BASE" "$BEFORE" "$AFTER"; then
            echo "PR diff unchanged by this push: keeping approval, skipping re-review"
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Drop approval of older commits
        if: github.event.action == 'synchronize' && steps.diff.outputs.unchanged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh pr view "$PR" --repo "$REPO" --json labels -q '.labels[].name' | grep -qx human-approved; then
            gh pr edit "$PR" --repo "$REPO" --remove-label human-approved
            gh pr comment "$PR" --repo "$REPO" --body "New commits changed this PR's diff: removed \`human-approved\`. Re-approve if the review still needs a human."
          fi

      - uses: anthropics/claude-code-action@v1
        id: claude
        if: steps.diff.outputs.unchanged != 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request's diff (`gh pr diff`).

            Standards, in priority order (earlier wins on conflict):
            1. CODING_STANDARDS.md and CLAUDE.md in this repo, if present
            2. .agent-config/CODING_STANDARDS.md, .agent-config/standards/*.md (examples), and .agent-config/languages/*.md, if present

            Look for: correctness bugs, violations of the standards, missing or weak tests
            for changed behavior, security problems. Skip style nits that a formatter or
            linter would catch; CI runs those separately.

            Rule tags decide what you check:
            - `review`, and the judgment half of `tool`+`review`: check every one against the diff.
            - `tool`: skip when this repo's CI or lint config wires the check (the repo's
              CODING_STANDARDS.md names it); otherwise treat it as `review`.
            - `hint`: mention only when the diff makes the smell clearly worse.
            - `process`: flag only when the diff itself shows the rule was broken.

            Stale docs: if the diff changes behavior, commands, file layout, or setup that
            a living doc describes (README.md, CONTEXT.md, other top-level *.md) and the PR
            doesn't update it, that's a finding. Dated docs (plans, specs, reviews with a
            date in the name or path) are snapshots; skip them.

            Output:
            - Inline comments for specific problems (one comment per problem, say what
              breaks and how to fix it).
            - One summary comment via `gh pr comment` listing blocking issues, then
              non-blocking suggestions. If there is nothing to say, say "No issues found."

            Labels (use `gh pr edit --add-label` / `--remove-label`):
            - Blocking issues found: add `agent-changes-requested`. None: remove it.
            - Add `needs-human` when correctness depends on a judgment you can't verify
              from the code: business rules, pricing or money, irreversible data changes
              or migrations, security trade-offs, product intent, stale docs (name the
              doc and section; the human updates it or approves as is). Say in the summary
              exactly what the human must decide. Never remove `needs-human` or
              `human-approved`; only a human does. Don't re-add `needs-human` for a
              decision a human already made on this PR (an "Approved via `/approve`"
              or "Human decision:" comment covers it) unless new commits change it.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh pr edit:*),Read,Glob,Grep"

      # Telemetry for tuning the review prompt: the full transcript as an
      # artifact, and turns / duration / cost in the step summary.
      - name: Keep the review transcript
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v7
        with:
          name: agent-review-transcript
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 7
      - name: Summarize the review run
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '[.[] | select(.type == "result")] | last // empty
            | "agent review: \(.num_turns) turns, \(.duration_ms / 1000 | floor)s, $\(.total_cost_usd // "n/a")"' \
            "$EXECUTION_FILE" >> "$GITHUB_STEP_SUMMARY" || echo "agent review: transcript unreadable" >> "$GITHUB_STEP_SUMMARY"

      # claude-code-action skips (and still succeeds) when the PR changes the
      # workflow that runs it, so the gate would pass unreviewed code.
      # Confirmed live 2026-10-05 on k-b3r/buy-and-sell-ai#10.
      - name: Flag a skipped review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          path=${WORKFLOW_REF#*/*/}
          path=${path%@*}
          if gh pr diff "$PR" --repo "$REPO" --name-only | grep -qxF "$path"; then
            gh pr edit "$PR" --repo "$REPO" --add-label needs-human
            gh pr comment "$PR" --repo "$REPO" --body "Agent review skipped: this PR changes \`$path\`, and the review action only runs a workflow identical to the default branch's. A human reviews this one."
          fi

  gate:
    needs: agent-review
    # Runs after a review, and on its own when a label it reads changes. Other
    # labels (automerge, merge-conflict) can't change the verdict, so skip
    # them: each run bills a minute. Auto-merge reads the newest gate run that
    # wasn't skipped.
    if: >-
      always() && github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      contains(fromJSON('["agent-changes-requested", "needs-human", "human-approved"]'), github.event.label.name))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check review result and labels
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_RESULT: ${{ needs.agent-review.result }}
        run: |
          if [ "$REVIEW_RESULT" = "failure" ] || [ "$REVIEW_RESULT" = "cancelled" ]; then
            echo "::error::agent review did not complete ($REVIEW_RESULT)"
            exit 1
          fi
          # Read labels fresh: the agent's own label edits don't trigger workflows.
          labels=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json labels -q '.labels[].name')
          has() { printf '%s\n' "$labels" | grep -qx "$1"; }
          if has agent-changes-requested; then
            echo "::error::agent requested changes, see the review comments"
            exit 1
          fi
          if has needs-human && ! has human-approved; then
            echo "::error::needs a human decision, see the review summary; add the human-approved label once reviewed"
            exit 1
          fi
          echo "gate passed"

  approve:
    # `/approve` from the repo owner only; anyone else's comment is ignored.
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write
      issues: write
    steps:
      - name: Label and re-run the failed gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          # In a called workflow this is the caller's file: owner/repo/<path>@<ref>.
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          gh pr edit "$PR" --repo "$REPO" --add-label human-approved --remove-label needs-human
          sha=$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q .headRefOid)
          path=${WORKFLOW_REF#*/*/}
          path=${path%@*}
          run_id=$(gh api "repos/$REPO/actions/runs?head_sha=$sha&event=pull_request&per_page=100" \
            -q "[.workflow_runs[] | select(.path == \"$path\")][0] | select(.conclusion == \"failure\") | .id")
          if [ -n "$run_id" ]; then
            gh run rerun "$run_id" --repo "$REPO" --failed
            gh pr comment "$PR" --repo "$REPO" --body "Approved via \`/approve\`: added \`human-approved\`, removed \`needs-human\`, re-running the gate."
          else
            gh pr comment "$PR" --repo "$REPO" --body "Approved via \`/approve\`: added \`human-approved\`, removed \`needs-human\` (no failed gate run to re-run)."
          fi
